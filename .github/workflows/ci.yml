name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  # Настоящая установка на Windows: install.ps1 из этого коммита, Ollama, маленькая модель, ярлык, вопрос помощнику.
  windows-install:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      MIREA_ASSISTANT_SRC: ${{ github.workspace }}
      MIREA_ASSISTANT_MODEL: qwen3:0.6b
    steps:
      - uses: actions/checkout@v4
      - name: Установка (как у преподавателя)
        shell: powershell
        run: Get-Content -Raw -Encoding UTF8 .\install.ps1 | Invoke-Expression
      - name: Повторная установка (обновление)
        shell: powershell
        run: Get-Content -Raw -Encoding UTF8 .\install.ps1 | Invoke-Expression
      - name: Проверка результата
        shell: pwsh  # PowerShell 7 читает этот шаг как UTF-8; сам установщик выше шёл через Windows PowerShell 5.1
        run: |
          $ErrorActionPreference = "Stop"
          $problems = @()
          $desk = [Environment]::GetFolderPath("Desktop")
          $shell = New-Object -ComObject WScript.Shell
          Write-Host "Рабочий стол: $desk"
          $lnks = @(Get-ChildItem -LiteralPath $desk -Filter *.lnk -ErrorAction SilentlyContinue)
          foreach ($l in $lnks) { Write-Host ("  {0} -> {1}" -f $l.Name, $shell.CreateShortcut($l.FullName).TargetPath) }
          if (-not ($lnks | Where-Object { $_.Name -eq "Помощник МИРЭА.lnk" })) { $problems += "нет ярлыка «Помощник МИРЭА» на рабочем столе" }

          $bin = Join-Path ((uv tool dir --bin) | Select-Object -First 1).Trim() "mirea-assistant.exe"
          & $bin status
          if ($LASTEXITCODE -ne 0) { $problems += "status: модель не готова" }

          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try { $s = Invoke-RestMethod http://127.0.0.1:8765/api/status; $ok = $true; break } catch { Start-Sleep 1 }
          }
          if (-not $ok) { $problems += "помощник не запустился после установки" }
          else {
            $s | ConvertTo-Json -Compress | Write-Host
            $body = @{ messages = @(@{ role = "user"; content = "Какие аудитории свободны в понедельник на 2-й паре в В-78?" }) } | ConvertTo-Json -Depth 5
            $r = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8765/api/chat -ContentType "application/json; charset=utf-8" -Body ([Text.Encoding]::UTF8.GetBytes($body)) -TimeoutSec 600
            Write-Host "ОТВЕТ: $($r.answer)"
            Write-Host "ИНСТРУМЕНТЫ: $(($r.steps | ForEach-Object { $_.tool + '=' + $_.ok + ' ' + ($_.args | ConvertTo-Json -Compress) }) -join '; ')"
            if (-not $r.answer) { $problems += "пустой ответ" }
          }
          if ($problems) { throw ($problems -join "; ") }
      - name: Журнал помощника
        if: always()
        shell: powershell
        run: Get-Content "$env:USERPROFILE\.mirea-assistant\assistant.log" -ErrorAction SilentlyContinue | Select-Object -Last 50
